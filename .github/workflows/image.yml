name: Image

# Builds the image on every pull request (amd64 only: Blender is shipped for it) and starts it read-only as non-root.
# Only main pushes, to ghcr.io/playgrifball/infinite-spartan-render (public), tagged sha-<commit>, main and latest,
# signed keyless with cosign; the signature is verified before the run ends.

on:
  push:
    branches: [main]
    paths: ["src/**", "blender/**", "Dockerfile", ".dockerignore", ".github/workflows/image.yml"]
  pull_request:
    paths: ["src/**", "blender/**", "Dockerfile", ".dockerignore", ".github/workflows/image.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/playgrifball/infinite-spartan-render
  DOCKER_METADATA_PR_HEAD_SHA: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: isr:smoke

      - name: Run it read-only, probe /health/live, and check Ekur loads in Blender
        run: |
          set -euo pipefail
          docker run -d --name isr --read-only --tmpfs /tmp -p 18080:8080 isr:smoke
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:18080/health/live; then echo; ok=1; break; fi
            sleep 2
          done
          docker logs isr | tail -n 40
          docker inspect isr --format 'user={{.Config.User}}'
          test "${ok:-0}" = 1 || { echo "::error::The image did not answer /health/live"; exit 1; }
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{"core":"","output":"png","size":"small"}' http://localhost:18080/spartans)" = 400
          docker exec isr /opt/blender/blender -b --python-expr 'import addon_utils; addon_utils.enable("bl_ext.user_default.ekur", default_set=True); import bpy; assert hasattr(bpy.types.Scene, "spartan_properties"), "Ekur did not register"; print("EKUR OK")' | tee /dev/stderr | grep -q "EKUR OK"
          docker rm -f isr

  publish:
    needs: smoke
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.4'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log into ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Sign the image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}
      - name: Verify the signature
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity "https://github.com/PlayGrifball/infinite-spartan-render/.github/workflows/image.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
