name: Image

# Builds the image once, starts it read-only as non-root and checks Ekur loads, then (main only) pushes that same image
# to ghcr.io/playgrifball/infinite-spartan-render (public), tagged sha-<commit>, main and latest, and signs it keyless
# with cosign; the signature is verified before the run ends.

on:
  push:
    branches: [main]
    paths: ["src/**", "blender/**", "Dockerfile", ".dockerignore", "global.json", "InfiniteSpartanRender.slnx", ".github/workflows/image.yml"]
  pull_request:
    paths: ["src/**", "blender/**", "Dockerfile", ".dockerignore", "global.json", "InfiniteSpartanRender.slnx", ".github/workflows/image.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/playgrifball/infinite-spartan-render
  DOCKER_METADATA_PR_HEAD_SHA: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      # Keyless signing (sigstore/fulcio identity challenge).
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Run it read-only and probe it; check Ekur loads the way the runner starts Blender
        run: |
          set -euo pipefail
          first="$(echo "${{ steps.meta.outputs.tags }}" | head -n1)"
          docker run -d --name isr --read-only --tmpfs /tmp --tmpfs /cache:uid=1654 -p 18080:8080 "$first"
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:18080/health/live; then echo; ok=1; break; fi
            sleep 2
          done
          docker logs isr | tail -n 40
          docker inspect isr --format 'user={{.Config.User}}'
          test "${ok:-0}" = 1 || { echo "::error::The image did not answer /health/live"; exit 1; }
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{"core":"","output":"png","size":"small"}' http://localhost:18080/spartans)" = 400
          docker exec -e HOME=/tmp isr /opt/blender/blender -b --factory-startup --python-expr 'import addon_utils; addon_utils.enable("bl_ext.user_default.ekur", default_set=True); import bpy; assert hasattr(bpy.types.Scene, "spartan_properties"), "Ekur did not register"; print("EKUR OK")' | tee /dev/stderr | grep -q "EKUR OK"
          docker rm -f isr

      - name: Install cosign
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.4'

      - name: Log into ghcr.io
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image pushed is the one tested above, not a second build.
      - name: Push, sign and verify
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          digest=""
          for tag in ${TAGS}; do
            out="$(docker push "$tag")"
            echo "$out"
            digest="$(echo "$out" | awk '/digest:/ {print $3}' | tail -n1)"
          done
          test -n "$digest"
          for tag in ${TAGS}; do cosign sign --yes "${tag}@${digest}"; done
          cosign verify "${IMAGE}@${digest}" \
            --certificate-identity "https://github.com/PlayGrifball/infinite-spartan-render/.github/workflows/image.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "Published and signed ${IMAGE}@${digest}" >> "$GITHUB_STEP_SUMMARY"
