name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: dotnet test InfiniteSpartanRender.slnx -c Release --collect:"XPlat Code Coverage"

  # Real Blender and Ekur renders on the in-cluster runner, which mounts the same trimmed game data the service
  # uses at /data (homelab arc-infinite-spartan-render). Never for pull requests from forks: the data is private.
  integration:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: infinite-spartan-render-k8s
    env:
      ISR_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: dotnet test InfiniteSpartanRender.slnx -c Release --filter "TestCategory=Integration"
