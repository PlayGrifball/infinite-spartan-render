{{- $r := .Values.ingressRoute -}}
{{- if $r.enabled }}
{{- if not $r.host }}{{ fail "ingressRoute.host is required when ingressRoute.enabled" }}{{ end }}
{{- /* The health endpoints are never routed. */}}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "infinite-spartan-render.fullname" . }}
  labels:
    {{- include "infinite-spartan-render.labels" . | nindent 4 }}
spec:
  entryPoints:
    {{- toYaml $r.entryPoints | nindent 4 }}
  routes:
    - kind: Rule
      match: {{ printf "Host(`%s`) && !PathRegexp(`(?i)^/+health(/|$)`)" $r.host | quote }}
      {{- with $r.middlewares }}
      middlewares:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      services:
        - name: {{ include "infinite-spartan-render.fullname" . }}
          port: {{ .Values.service.port }}
  {{- if or $r.tls.secretName $r.tls.certResolver }}
  tls:
    {{- with $r.tls.secretName }}
    secretName: {{ . }}
    {{- end }}
    {{- with $r.tls.certResolver }}
    certResolver: {{ . }}
    {{- end }}
  {{- end }}
{{- end }}
